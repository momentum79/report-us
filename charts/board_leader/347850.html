    var amtline=s.amt?('<div style="color:'+pc+'">'+(s.amt>0?'+':'')+Math.round(s.amt).toLocaleString()+'</div>'):'';
    html+='<div class="s" style="left:'+x+'px;top:'+(y-18)+'px">'+amtline+
          '<div style="color:'+pc+'">'+s.pct+'</div>'+
          '<div style="color:#1448cc">S</div></div>';
  });
  an.innerHTML=html;
}
ch.timeScale().subscribeVisibleLogicalRangeChange(drawAnno);
var tot=D.ohlc.length,from=Math.max(0,tot-60),to=tot-1+6;
ch.timeScale().setVisibleLogicalRange({from:from,to:to});
drawAnno();
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){[[ch,cc],[rc,rr]].forEach(function(pr){try{pr[0].applyOptions({width:pr[1].clientWidth,height:pr[1].clientHeight});}catch(e){}});drawAnno();},150);});
})();
</script>

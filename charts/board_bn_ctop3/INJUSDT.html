const axisFmt=n=>{if(DEC)return fmt(n);const v=Math.round(n);return Math.abs(v)>=1000000?Math.round(v/1000).toLocaleString()+'K':v.toLocaleString();};
const PF={type:'custom',minMove:DEC?Math.pow(10,-DEC):1,formatter:axisFmt};
const cc=document.getElementById('cc'),rr=document.getElementById('rr'),lg=document.getElementById('lg');
function mk(el,opts){return LightweightCharts.createChart(el,Object.assign({width:el.clientWidth,height:el.clientHeight||300,
  layout:{background:{color:'#fff'},textColor:'#333',fontSize:11},
  grid:{vertLines:{color:'#f3f3f3'},horzLines:{color:'#f3f3f3'}},
  rightPriceScale:{borderColor:'#ddd'},
  timeScale:{borderColor:'#ddd',rightOffset:6,minBarSpacing:1.5},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
  localization:{priceFormatter:axisFmt}},opts));}
const ch=mk(cc,{rightPriceScale:{scaleMargins:{top:0.08,bottom:0.22}},timeScale:{visible:false}});
const tb=ch.addHistogramSeries({priceScaleId:'tbg',base:0,priceLineVisible:false,lastValueVisible:false});
ch.priceScale('tbg').applyOptions({scaleMargins:{top:0,bottom:0},visible:false});
tb.setData(D.trend);
const cs=ch.addCandlestickSeries({upColor:UP,downColor:DN,borderUpColor:UP,borderDownColor:DN,wickUpColor:UP,wickDownColor:DN,priceFormat:PF});
cs.setData(D.ohlc);
const vol=ch.addHistogramSeries({priceScaleId:'v',priceFormat:{type:'custom',minMove:1,formatter:v=>Math.round(v/1000).toLocaleString()+'K'}});
ch.priceScale('v').applyOptions({scaleMargins:{top:0.82,bottom:0}});
vol.setData(D.vol);
MA.forEach(function(m){var ln=ch.addLineSeries({color:m[1],lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,priceFormat:PF,autoscaleInfoProvider:function(){return null;}});ln.setData(D.ma[m[0]]);});
if(D.markers&&D.markers.length)cs.setMarkers(D.markers);

function fillArrows(ch,cs,an,D){
  if(!an)return;
  var ts=ch.timeScale(),F=D.fills||[],S=D.sells||[],L=20,sig='';
  var COL={B:'#111',A:'#7c3aed'};
  var CARD=/(^| )card( |$)/.test(document.documentElement.className);   // 날짜별 카드: 금액 줄 생략(제목에 있음)
  var sByT={};S.forEach(function(s){(sByT[s.time]=sByT[s.time]||[]).push(s);});
  // 10-09 사용자 확정: 끝(체결가)을 축으로 6° 기울여 꼬리를 왼쪽으로(B=왼쪽 아래, S=왼쪽 위),
  // 안쪽 채움 투명도 80%(불투명 0.2, 10-09 90%→80%) + 같은 색 얇은 테두리 → 캔들을 덜 가린다.
  var TILT=6,FOP=0.2;
  function up(x,y,c){return '<svg class="fa" width="12" height="'+L+'" style="left:'+(x-6)+'px;top:'+y+'px;'+
    'transform-origin:6px 0;transform:rotate('+TILT+'deg)">'+
    '<path d="M6 0.5L11.5 7.5H8V'+(L-0.5)+'H4V7.5H0.5Z" fill="'+c+'" fill-opacity="'+FOP+'" stroke="'+c+'" stroke-width="0.9"/></svg>';}
  function dn(x,y){return '<svg class="fa" width="12" height="'+L+'" style="left:'+(x-6)+'px;top:'+(y-L)+'px;'+
    'transform-origin:6px '+L+'px;transform:rotate(-'+TILT+'deg)">'+
    '<path d="M6 '+(L-0.5)+'L11.5 '+(L-7.5)+'H8V0.5H4V'+(L-7.5)+'H0.5Z" fill="#111" fill-opacity="'+FOP+'" stroke="#111" stroke-width="0.9"/></svg>';}
  function draw(){
    var html='',lowB={},highS={};
    if(D.focus){
      var fx=ts.timeToCoordinate(D.focus);
      if(fx!=null){var bw=Math.max(6,ts.options().barSpacing||6);
        html+='<div class="fband" style="left:'+(fx-bw/2)+'px;width:'+bw+'px"></div>';}
    }
    F.forEach(function(f){
      var x=ts.timeToCoordinate(f.t),y=cs.priceToCoordinate(f.p);
      if(x==null||y==null)return;
      if(f.s==='S'){html+=dn(x,y);var e2=y-L;if(!highS[f.t]||e2<highS[f.t].y)highS[f.t]={x:x,y:e2};return;}
      html+=up(x,y,COL[f.s]||COL.B);var e=y+L;
      var o=lowB[f.t];if(!o){o=lowB[f.t]={x:x,y:e,k:{}};}
      if(e>o.y){o.y=e;o.x=x;}
      o.k[f.s]=1;
    });
    Object.keys(lowB).forEach(function(t){
      var o=lowB[t],txt=(o.k.B?'B':'')+(o.k.B&&o.k.A?'·':'')+(o.k.A?'<span style="color:#7c3aed">A</span>':'');
      html+='<div class="fl" style="left:'+o.x+'px;top:'+(o.y+1)+'px">'+txt+'</div>';});
    Object.keys(highS).forEach(function(t){
      var inner='';
      (sByT[t]||[]).forEach(function(s){
        var pc=s.profit?'#111111':'#e11d1d';
        if(s.amt&&!CARD)inner+='<div style="color:'+pc+'">'+(s.amt>0?'+':'')+(D.amtDec?s.amt.toFixed(2):Math.round(s.amt).toLocaleString())+'</div>';
        inner+='<div style="color:'+pc+'">'+s.pct+'</div>';});
      html+='<div class="s" style="left:'+highS[t].x+'px;top:'+(highS[t].y-1)+'px">'+inner+
            '<div style="color:#111">S</div></div>';});
    an.innerHTML=html;
    unclutter();
  }
  // 손익 라벨 겹침 풀기(10-09): 붙은 날짜끼리 겹치면 빈 자리(위 → 좌우 → 더 위 순)를 찾아 옮기고
  // 원래 화살표 꼬리와 점선으로 잇는다. 차트 위·좌우 끝과 가격축 밖으로는 안 나간다.
  // 라벨(.s)은 left=가운데, top=아랫변(translate -50%,-100%).
  function unclutter(){
    var paneW=an.clientWidth;
    try{paneW-=cs.priceScale().width()||0;}catch(e){}
    var labs=[].slice.call(an.querySelectorAll('.s')).sort(function(a,b){
      return parseFloat(a.style.left)-parseFloat(b.style.left);});
    var placed=[],extra='';
    function free(cx,b,w,h){
      if(b-h<1||cx-w/2<1||cx+w/2>paneW-1)return false;
      for(var k=0;k<placed.length;k++){var p=placed[k];
        if(Math.abs(p.cx-cx)<(p.w+w)/2+2&&b>p.b-p.h-1&&b-h<p.b+1)return false;}
      return true;
    }
    labs.forEach(function(el){
      var w=el.offsetWidth,h=el.offsetHeight,x0=parseFloat(el.style.left),b0=parseFloat(el.style.top);
      var bx=Math.max(w/2+2,Math.min(x0,paneW-w/2-2)),best=null,cands=[];
      for(var j=0;j<=4;j++)for(var i=-3;i<=3;i++)cands.push({x:bx+i*(w/2+3),b:b0-j*(h+2),c:Math.abs(i)*1.3+j});
      cands.push({x:bx,b:b0+h+24,c:9});                      // 마지막 수: 화살표 아래쪽
      cands.sort(function(a,b){return a.c-b.c;});
      for(var n=0;n<cands.length;n++){if(free(cands[n].x,cands[n].b,w,h)){best=cands[n];break;}}
      if(!best)best={x:bx,b:Math.max(b0,h+1)};
      el.style.left=best.x+'px';el.style.top=best.b+'px';
      if(Math.abs(best.x-x0)>1||Math.abs(best.b-b0)>1){
        var ly=best.b>b0?best.b-h:best.b;                     // 라벨에서 화살표 꼬리(x0,b0)까지
        extra+='<svg class="fa" style="left:0;top:0;width:1px;height:1px"><line x1="'+best.x+'" y1="'+ly+
               '" x2="'+x0+'" y2="'+b0+'" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/></svg>';
      }
      placed.push({cx:best.x,b:best.b,w:w,h:h});
    });
    if(extra)an.insertAdjacentHTML('afterbegin',extra);
  }
  function tick(){
    var r=ts.getVisibleLogicalRange();
    var k=(r?r.from.toFixed(3)+','+r.to.toFixed(3):'-')+'|'+cs.priceToCoordinate(D.hi)+'|'+
          cs.priceToCoordinate(D.lo)+'|'+an.clientWidth+'x'+an.clientHeight+'|'+(D.focus||'');
    if(k!==sig){sig=k;draw();}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

cs.createPriceLine({price:D.hi,color:'#E63946',lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title:'고'});
cs.createPriceLine({price:D.lo,color:'#3A86FF',lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title:'저'});
const rc=mk(rr,{rightPriceScale:{scaleMargins:{top:0.12,bottom:0.12}},timeScale:{timeVisible:false}});
const rl=rc.addLineSeries({color:DN,lineWidth:1,priceLineVisible:false,lastValueVisible:true,crosshairMarkerVisible:false});rl.setData(D.rsi);
const rm=rc.addLineSeries({color:UP,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});rm.setData(D.rsi14);
[70,30].forEach(function(lv){rl.createPriceLine({price:lv,color:'#9ca3af',lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true});});
function sync(a,b){var lk=false;function s(x,y){x.timeScale().subscribeVisibleLogicalRangeChange(function(r){if(lk||!r)return;lk=true;y.timeScale().setVisibleLogicalRange(r);lk=false;});}s(a,b);s(b,a);}
sync(ch,rc);
var byT=new Map(D.ohlc.map(function(b){return [b.time,b];}));
ch.subscribeCrosshairMove(function(p){
  if(!p.time||!p.point||!byT.has(p.time)){lg.style.display='none';return;}
  var b=byT.get(p.time),cu=b.close>=b.open?UP:DN;
  lg.innerHTML='<b>'+b.time+'</b>  종가 <b style="color:'+cu+'">'+fmt(b.close)+'</b>  시 '+fmt(b.open)+'  고 <span style="color:'+UP+'">'+fmt(b.high)+'</span>  저 <span style="color:'+DN+'">'+fmt(b.low)+'</span>';
  lg.style.display='block';
});
// B/S = 체결가 화살표 오버레이 (가로·세로 확대/축소 모두 따라감)
fillArrows(ch,cs,document.getElementById('an'),D);
var tot=D.ohlc.length,from=Math.max(0,tot-60),to=tot-1+6;
ch.timeScale().setVisibleLogicalRange({from:from,to:to});
// ?focus=YYYY-MM-DD → 그 봉을 강조하고 그 앞 45봉 ~ 뒤 12봉을 보여준다 (날짜별 카드)
var fq=(location.search.match(/[?&]focus=([0-9-]{10})/)||[])[1];
if(fq&&tot){var fi=D.ohlc.findIndex(function(b){return b.time>=fq;});if(fi<0)fi=tot-1;
  D.focus=D.ohlc[fi].time;ch.timeScale().setVisibleLogicalRange({from:Math.max(0,fi-45),to:Math.min(tot-1+3,fi+12)});}
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){[[ch,cc],[rc,rr]].forEach(function(pr){try{pr[0].applyOptions({width:pr[1].clientWidth,height:pr[1].clientHeight});}catch(e){}});},150);});
})();
</script>
</body>
</html>

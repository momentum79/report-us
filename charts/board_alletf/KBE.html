const UP='#f23645',DN='#2962ff';
const MA=[['5','#E63946'],['10','#555555'],['20','#F4A261'],['60','#2D9D5F']];
const fmt=n=>Math.round(n).toLocaleString();
const axisFmt=n=>{const v=Math.round(n);return Math.abs(v)>=1000000?Math.round(v/1000).toLocaleString()+'K':v.toLocaleString();};
const PF={type:'custom',minMove:1,formatter:axisFmt};
const cc=document.getElementById('cc'),rr=document.getElementById('rr'),lg=document.getElementById('lg');
function mk(el,opts){return LightweightCharts.createChart(el,Object.assign({width:el.clientWidth,height:el.clientHeight||300,
  layout:{background:{color:'#fff'},textColor:'#333',fontSize:11},
  grid:{vertLines:{color:'#f3f3f3'},horzLines:{color:'#f3f3f3'}},
  rightPriceScale:{borderColor:'#ddd'},
  timeScale:{borderColor:'#ddd',rightOffset:6,minBarSpacing:1.5},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
  localization:{priceFormatter:axisFmt}},opts));}
const ch=mk(cc,{rightPriceScale:{scaleMargins:{top:0.08,bottom:0.22}},timeScale:{visible:false}});
const tb=ch.addHistogramSeries({priceScaleId:'tbg',base:0,priceLineVisible:false,lastValueVisible:false});
ch.priceScale('tbg').applyOptions({scaleMargins:{top:0,bottom:0},visible:false});
tb.setData(D.trend);
const cs=ch.addCandlestickSeries({upColor:UP,downColor:DN,borderUpColor:UP,borderDownColor:DN,wickUpColor:UP,wickDownColor:DN,priceFormat:PF});
cs.setData(D.ohlc);
const vol=ch.addHistogramSeries({priceScaleId:'v',priceFormat:{type:'custom',minMove:1,formatter:v=>Math.round(v/1000).toLocaleString()+'K'}});
ch.priceScale('v').applyOptions({scaleMargins:{top:0.82,bottom:0}});
vol.setData(D.vol);
MA.forEach(function(m){var ln=ch.addLineSeries({color:m[1],lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,priceFormat:PF,autoscaleInfoProvider:function(){return null;}});ln.setData(D.ma[m[0]]);});
if(D.markers&&D.markers.length)cs.setMarkers(D.markers);
cs.createPriceLine({price:D.hi,color:'#E63946',lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title:'고'});

const rc=mk(rr,{rightPriceScale:{scaleMargins:{top:0.12,bottom:0.12}},timeScale:{timeVisible:false}});

ch.subscribeCrosshairMove(function(p){

  var b=byT.get(p.time),cu=b.close>=b.open?UP:DN;
  lg.innerHTML='<b>'+b.time+'</b>  종가 <b style="color:'+cu+'">'+fmt(b.close)+'</b>  시 '+fmt(b.open)+'  고 <span style="color:'+UP+'">'+fmt(b.high)+'</span>  저 <span style="color:'+DN+'">'+fmt(b.low)+'</span>';
  lg.style.display='block';
});
var an=document.getElementById('an');
function drawAnno(){
  if(!D.sells||!D.sells.length){an.innerHTML='';return;}
  var ts=ch.timeScale(),html='';
  D.sells.forEach(function(s){
    var x=ts.timeToCoordinate(s.time);if(x==null)return;
    var y=cs.priceToCoordinate(s.high);if(y==null)return;
    var pc=s.profit?'#111111':'#e11d1d';
    var amtline=s.amt?('<div style="color:'+pc+'">'+(s.amt>0?'+':'')+Math.round(s.amt).toLocaleString()+'</div>'):'';
    html+='<div class="s" style="left:'+x+'px;top:'+(y-18)+'px">'+amtline+
          '<div style="color:'+pc+'">'+s.pct+'</div>'+
          '<div style="color:#1448cc">S</div></div>';
  });
  an.innerHTML=html;
}

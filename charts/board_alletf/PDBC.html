function fillArrows(ch,cs,an,D){
  if(!an)return;
  var ts=ch.timeScale(),F=D.fills||[],S=D.sells||[],L=20,sig='';
  var COL={B:'#111',A:'#7c3aed'};
  var CARD=/(^| )card( |$)/.test(document.documentElement.className);   // 날짜별 카드: 금액 줄 생략(제목에 있음)
  var sByT={};S.forEach(function(s){(sByT[s.time]=sByT[s.time]||[]).push(s);});

    '<path d="M6 0.5L11.5 7.5H8V'+(L-0.5)+'H4V7.5H0.5Z" fill="'+c+'" stroke="#fff" stroke-width="1"/></svg>';}
  function dn(x,y){return '<svg class="fa" width="12" height="'+L+'" style="left:'+(x-6)+'px;top:'+(y-L)+'px">'+
    '<path d="M6 '+(L-0.5)+'L11.5 '+(L-7.5)+'H8V0.5H4V'+(L-7.5)+'H0.5Z" fill="#1448cc" stroke="#fff" stroke-width="1"/></svg>';}
  function draw(){
    var html='',lowB={},highS={};
    if(D.focus){
      var fx=ts.timeToCoordinate(D.focus);
      if(fx!=null){var bw=Math.max(6,ts.options().barSpacing||6);
        html+='<div class="fband" style="left:'+(fx-bw/2)+'px;width:'+bw+'px"></div>';}
    }
    F.forEach(function(f){
      var x=ts.timeToCoordinate(f.t),y=cs.priceToCoordinate(f.p);
      if(x==null||y==null)return;
      if(f.s==='S'){html+=dn(x,y);var e2=y-L;if(!highS[f.t]||e2<highS[f.t].y)highS[f.t]={x:x,y:e2};return;}
      html+=up(x,y,COL[f.s]||COL.B);var e=y+L;
      var o=lowB[f.t];if(!o){o=lowB[f.t]={x:x,y:e,k:{}};}
      if(e>o.y){o.y=e;o.x=x;}
      o.k[f.s]=1;
    });
    Object.keys(lowB).forEach(function(t){
      var o=lowB[t],txt=(o.k.B?'B':'')+(o.k.B&&o.k.A?'·':'')+(o.k.A?'<span style="color:#7c3aed">A</span>':'');
      html+='<div class="fl" style="left:'+o.x+'px;top:'+(o.y+1)+'px">'+txt+'</div>';});
    Object.keys(highS).forEach(function(t){
      var inner='';
      (sByT[t]||[]).forEach(function(s){
        var pc=s.profit?'#111111':'#e11d1d';
        if(s.amt&&!CARD)inner+='<div style="color:'+pc+'">'+(s.amt>0?'+':'')+(D.amtDec?s.amt.toFixed(2):Math.round(s.amt).toLocaleString())+'</div>';
        inner+='<div style="color:'+pc+'">'+s.pct+'</div>';});
      html+='<div class="s" style="left:'+highS[t].x+'px;top:'+(highS[t].y-1)+'px">'+inner+
            '<div style="color:#1448cc">S</div></div>';});
    an.innerHTML=html;
  }
  function tick(){
    var r=ts.getVisibleLogicalRange();
    var k=(r?r.from.toFixed(3)+','+r.to.toFixed(3):'-')+'|'+cs.priceToCoordinate(D.hi)+'|'+
          cs.priceToCoordinate(D.lo)+'|'+an.clientWidth+'x'+an.clientHeight+'|'+(D.focus||'');
    if(k!==sig){sig=k;draw();}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ?focus=YYYY-MM-DD → 그 봉을 강조하고 그 앞 45봉 ~ 뒤 12봉을 보여준다 (날짜별 카드)
